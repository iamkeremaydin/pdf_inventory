name: Release

# Push a tag such as v1.0.0 to build and publish the app for Windows, macOS and Linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Tag must match the version in the app
        run: python -c "import os, pdf_inventory as p; tag = os.environ['GITHUB_REF_NAME'].lstrip('v'); assert p.APP_VERSION == 'MVP ' + tag, (p.APP_VERSION, tag)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "MVP ${GITHUB_REF_NAME#v}"
          --notes-file docs/RELEASE_NOTES.md
          --verify-tag

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install "pypdf==6.21.4" "pyinstaller==6.22.3"
      - run: python -m unittest -v

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --onefile --windowed --name "PDF Master Suite" pdf_inventory.py
          mv "dist/PDF Master Suite.exe" "PDF-Master-Suite-${{ matrix.label }}.exe"
          echo "ASSET=PDF-Master-Suite-${{ matrix.label }}.exe" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --windowed --name "PDF Master Suite" pdf_inventory.py
          ditto -c -k --keepParent "dist/PDF Master Suite.app" "PDF-Master-Suite-${{ matrix.label }}.zip"
          echo "ASSET=PDF-Master-Suite-${{ matrix.label }}.zip" >> "$GITHUB_ENV"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --onefile --name "pdf-master-suite" pdf_inventory.py
          tar -C dist -czf "PDF-Master-Suite-${{ matrix.label }}.tar.gz" pdf-master-suite
          echo "ASSET=PDF-Master-Suite-${{ matrix.label }}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
